name: cfip-pool (preview)
# v2 执行单 S1：预览模式。结果只进 artifact 和 job summary，不提交仓库。
on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 20 * * *'   # 04:30 CST
permissions:
  contents: read
concurrency:
  group: cfip-pool
  cancel-in-progress: false
jobs:
  pool-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/pool.py --preview --repo . --outdir preview
      - uses: actions/upload-artifact@v4
        with: { name: pool-preview, path: preview/, retention-days: 14 }
